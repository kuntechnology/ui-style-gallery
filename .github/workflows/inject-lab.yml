name: inject-lab
on:
  push:
    paths: ['.github/workflows/inject-lab.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node _lab/inject.cjs
      - name: 提交改动
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "chore: 注入站点统计脚本 [skip ci]"; git push; fi
